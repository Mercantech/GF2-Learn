# Lokal Docker (Compose 2.24.4+). Se DEPLOYMENT.md.

services:
  web:
    ports:
      - "127.0.0.1:${WEB_HOST_PORT:-8031}:8080"
    environment:
      GF2_BEHIND_REVERSE_PROXY: "false"
    networks: !override [internal]
    labels: !reset []

  postgres:
    env_file: !reset []
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Sæt POSTGRES_PASSWORD i .env}

networks:
  dokploy-network: !reset null
